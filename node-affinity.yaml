apiVersion: v1
kind: Pod
metadata:
  name: aff-pref                 # Pod name
  labels:
    app: myapp                   # Pod label
spec:
  containers:
  - name: con1
    image: nginx:latest
    ports:
    - containerPort: 80
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1                 # Define percentage
        preference:
          matchExpressions:
          - key: color
            operator: NotIn
            values:
            - red
