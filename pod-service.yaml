# Pod Defination
apiVersion: v1                  #defined by kubernetes
kind: Pod                       #what object to create
metadata:
  name: newpod                  #Pad name
  labels:
    app: myapp
spec:                           # Pod specification
  containers:
  - name: con1                  #name of conatiner
    image: nginx:1.14.2          # image for container creation
    ports:
    - containerPort: 80          #contianer port

---                              # yaml seprator
# Service Defination
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: myapp          #Select conatiner with given label
  type: NodePort
