apiVersion: v1
kind: ReplicationController                # Object Type
metadata:
  name: myrc                              # Replication Controller Name
spec:
  replicas: 3                              # Will create 3 pods
  selector:                                # RC seletes pod with matching label
    app: myapp
  template:                                # Template to create POD
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: con1
        image: nginx
        ports:
        - containerPort: 80
