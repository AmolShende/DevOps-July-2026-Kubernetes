apiVersion: v1                  #defined by kubernetes
kind: Pod                       #what object to create
metadata:
  name: newpod                  #Pad name
  labels:
    app: myapp
spec:                           # Pod specification
  containers:
  - name: con1                  #name of conatiner
    image: nginx:1.14.2          # image for container creation
    ports:
    - containerPort: 80          #contianer port
    resources:                   # We can define resource usage.
      requests:                  # Minimum resource required
        memory: "64Mi"
        cpu: "250m"
      limits:                   #Maximum resource utilization
        memory: "128Mi"
        cpu: "500m"
  - name: con2
    image: tomcat:latest
    ports:
    - containerPort: 8080
  nodeName: node2
