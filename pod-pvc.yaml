apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: myapp
    env: dev
spec:
  volumes:
    - name: myvol                    # Volume Defination. Volume type is PVC
      persistentVolumeClaim:
        claimName: mypvc             # Name of PVC
  containers:
    - name: con1
      image: nginx:latest
      ports:
      - containerPort: 80
      volumeMounts:                  # We use PVC inside container, on /data folder
      - mountPath: /data
        name: myvol
