apiVersion: apps/v1
kind: DaemonSet           #Object type is Daemonset
metadata:
  name: myapp             #Name of Daemonset
spec:
  selector:
    matchLabels:
     app: mango
  template:
    metadata:
      labels:
        app: mango
    spec:
      containers:
      - name: con1
        image: nginx
        ports:
        - containerPort: 80
