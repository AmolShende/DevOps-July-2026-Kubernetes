apiVersion: v1
kind: Pod
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  containers:
  - name: con1
    image: wordpress:latest
    ports:
    - containerPort: 80
    envFrom:                # Will use all values from configMap
    - configMapRef:
        name: mywp
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc                       #name of wordpress service
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
  - port: 80
    protocol: TCP
    nodePort: 30123
