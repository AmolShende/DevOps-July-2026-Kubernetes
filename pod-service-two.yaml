# POD Defination :- Contains two conatiners
apiVersion: v1
kind: Pod
metadata:
  name: nginx-tomcat-pod
  labels:
    app: webapp
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

    - name: tomcat
      image: tomcat:9.0
      ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - name: nginx          # Will reach to conatiner nginx
      port: 80
      targetPort: 80
    - name: tomcat         # Will reach to conatiner tomcat
      port: 8080
      targetPort: 8080

